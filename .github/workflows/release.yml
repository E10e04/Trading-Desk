name: Release desktop apps
# Pousser un tag `vX.Y.Z` construit les installateurs Windows (NSIS) et macOS Intel (DMG) et les attache à la release GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win, artifact: 'desktop/release/*.exe' }
          - { os: macos-15-intel, target: mac, artifact: 'desktop/release/*.dmg' }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Environnement Python
        run: python -m venv backend/.venv
      - name: Frontend (build)
        run: cd frontend && npm ci && npm run build
      - name: Backend (dépendances)
        run: |
          PY=backend/.venv/bin/python; [ -x "$PY" ] || PY=backend/.venv/Scripts/python.exe
          "$PY" -m pip install -r backend/requirements.lock.txt pyinstaller==6.11.1
      - name: Backend embarqué (PyInstaller)
        run: |
          PY=.venv/bin/python; [ -x "backend/$PY" ] || PY=.venv/Scripts/python.exe
          cd backend && "$PY" -m PyInstaller --noconfirm --distpath build-dist --workpath build-work trading-backend.spec
          mkdir -p ../desktop/build && cp -R build-dist/trading-backend ../desktop/build/backend
      - name: Installateur (Electron)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: cd desktop && npm ci && npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: trading-desk-${{ matrix.target }}
          path: ${{ matrix.artifact }}
      - name: Attacher à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          body: |
            Application de bureau **paper trading** (aucun argent réel). Installateurs **non signés** : Windows SmartScreen / macOS Gatekeeper demanderont une autorisation manuelle.
            macOS : build Intel x86_64, Electron 22.3.27 (macOS 11+).
